    <script>
        const menuToggle = document.getElementById('menuToggle');
        const navLinks = document.getElementById('navLinks');
        const menuIcon = document.getElementById('menuIcon');

        function fermerMenu() {
            navLinks.classList.remove('active');
            menuIcon.src = 'img/menu.svg';
            menuToggle.setAttribute('aria-label', 'Ouvrir le menu');
        }

        menuToggle.addEventListener('click', function () {
            const estOuvert = navLinks.classList.toggle('active');
            menuIcon.src = estOuvert ? 'img/croix.svg' : 'img/menu.svg';
            menuToggle.setAttribute('aria-label', estOuvert ? 'Fermer le menu' : 'Ouvrir le menu');
        });

        navLinks.querySelectorAll('a').forEach(function (lien) {
            lien.addEventListener('click', fermerMenu);
        });
    </script>

</body>
